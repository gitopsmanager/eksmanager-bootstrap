AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EKSManager Enable Account StackSet — deploys EKSManagerAdminRole with an
  inline region restriction policy to each explicitly enabled spoke account.
  AllowedRegions are baked into the policy at deploy time; update the StackSet
  to change them. Run by the agent when an account is enabled via Terraform or GUI.

Parameters:
  SharedServicesAccountId:
    Type: String
    Description: >
      Account ID of the shared-services account where EKSManagerAgentRole
      lives. Used to build the trust principal for EKSManagerAdminRole.

Mappings:
  AccountRegionMap:
${account_region_mappings}

Conditions:
  # True only for accounts actually listed in org_config -- reuses the same
  # AllowedRegions lookup rather than a second per-account Mapping field.
  # Falling through to the "none" sentinel means this account was never
  # enrolled at all.
  AccountIsEnrolled: !Not
    - !Equals
      - !FindInMap [AccountRegionMap, !Ref "AWS::AccountId", "AllowedRegions", DefaultValue: "none"]
      - "none"

Resources:
  EKSManagerAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EKSManagerAdminRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        # Two roles in the shared-services account, neither of which is the
        # spoke account this stack is deployed into. They are separate
        # statements rather than one principal list because each is pinned to a
        # different session name, and that pinning is what lets the identity
        # policy tell them apart -- see DenyNonIngressWorkForPipelineSessions.
        #
        # Both halves are required. The trust condition stops the pipeline
        # choosing a session name that would evade the Deny; the Deny is what
        # actually removes the permissions. Drop either and the pipeline gets
        # the whole policy back.
        Statement:
          # The runtime agent. Anything except the pipeline's reserved session
          # name -- without this exclusion the agent could adopt that name and
          # the Deny would apply to it too, breaking cluster builds in a way
          # that points at the wrong thing entirely.
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::$${SharedServicesAccountId}:role/EKSManagerAgentRole"
            Action: sts:AssumeRole
            Condition:
              StringNotEquals:
                sts:RoleSessionName: eksmanager-prefix-lists-add-cluster
          # The add-cluster CodeBuild pipeline. All it does is look prefix
          # lists up by name and add ingress rules to the EKS and NLB security
          # groups (see terraform/add-cluster) -- it does not create or modify
          # the prefix lists themselves, which the client manages with their
          # own Terraform.
          #
          # The session name is fixed here, matching terraform/add-cluster's
          # providers.tf. Changing it there without changing it here fails the
          # AssumeRole outright, which is the point: the alternative failure --
          # a renamed session silently falling outside the Deny and regaining
          # iam:* and eks: writes -- would be invisible.
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::$${SharedServicesAccountId}:role/EKSManagerPrefixListsSharedRole"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:RoleSessionName: eksmanager-prefix-lists-add-cluster
      Policies:
        - PolicyName: EKSManagerAdminPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read is wildcarded, write is enumerated. Describe/List on eks
              # and ec2 is inventory data the agent reads constantly and is not
              # worth chasing action by action; everything that mutates is
              # listed explicitly so adding a capability is a visible change
              # here rather than something a broad grant already covered.
              #
              # Derived from the calls the code actually makes, cross-checked
              # against an IAM Access Analyzer policy generated from CloudTrail.
              # That generation reported isComplete=false over a three-week
              # window, so it was used to find *unused* services rather than as
              # the source of truth for what is needed.
              - Sid: AllowEKSRead
                Effect: Allow
                Action:
                  - eks:Describe*
                  - eks:List*
                Resource: "*"
              # EKS writes are scoped by the EKSManager tag the agent sets at
              # creation (awsapi.py, managed_tags_cli_fragment). Which resource
              # aws:ResourceTag reads is NOT uniform, which is why these are
              # split rather than one statement:
              #   - CreateNodegroup, CreateAddon, CreatePodIdentityAssociation
              #     and the cluster Update* actions evaluate it against the
              #     CLUSTER
              #   - DeleteNodegroup and the nodegroup Update* actions evaluate
              #     it against the NODE GROUP
              # Tag only one of the two and half these actions stay open on
              # every cluster in the account.
              #
              # A cluster or node group created before the agent set this tag
              # carries no EKSManager tag and cannot be managed until someone adds
              # it by hand. That is the intended behaviour -- adoption is a
              # human action, see DenyEKSManagerTagWrites below.
              - Sid: AllowEKSCreateCluster
                Effect: Allow
                Action: eks:CreateCluster
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/EKSManager: 'Managed'
              # Both conditions apply: the cluster must already be ours, and
              # the new node group must be born with the tag -- otherwise the
              # agent could create one it is then unable to delete.
              - Sid: AllowEKSCreateNodegroup
                Effect: Allow
                Action: eks:CreateNodegroup
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/EKSManager: 'Managed'
                    aws:RequestTag/EKSManager: 'Managed'
              # Creating something INSIDE a cluster: the cluster must be ours,
              # and the new resource must be born tagged. Kept apart from the
              # cluster Update* actions below precisely because of that second
              # condition -- UpdateClusterConfig sends no tags, so folding it
              # in here would deny it outright.
              - Sid: AllowEKSCreateInCluster
                Effect: Allow
                Action:
                  - eks:CreateAddon
                  - eks:CreatePodIdentityAssociation
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/EKSManager: 'Managed'
                    aws:RequestTag/EKSManager: 'Managed'
              - Sid: AllowEKSClusterUpdate
                Effect: Allow
                Action:
                  - eks:UpdateClusterConfig
                  - eks:UpdateClusterVersion
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/EKSManager: 'Managed'
              - Sid: AllowEKSNodegroupScopedWrite
                Effect: Allow
                Action:
                  - eks:DeleteNodegroup
                  - eks:UpdateNodegroupConfig
                  - eks:UpdateNodegroupVersion
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/EKSManager: 'Managed'
              # Scoped against the ADD-ON's own tags, not the cluster's. The
              # install path deletes the existing add-on before recreating it,
              # so DeleteAddon runs against one the agent tagged on the way in.
              # An add-on predating that tag cannot be deleted here -- there
              # are none, since every cluster is rebuilt on this code.
              - Sid: AllowEKSAddonWrite
                Effect: Allow
                Action:
                  - eks:UpdateAddon
                  - eks:DeleteAddon
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/EKSManager: 'Managed'
              # UpdatePodIdentityAssociation repoints an existing association
              # at a new role, which is how a cluster built before the roles
              # became per-cluster is reconciled. Only one association may
              # exist per service account, so without it the only route is
              # delete and recreate by hand. It is scoped against the
              # association's own tags, so the ones it repoints must have been
              # created by this code.
              - Sid: AllowEKSPodIdentityWrite
                Effect: Allow
                Action:
                  - eks:UpdatePodIdentityAssociation
                  - eks:DeletePodIdentityAssociation
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/EKSManager: 'Managed'
              - Sid: AllowEKSTagging
                Effect: Allow
                Action:
                  - eks:TagResource
                  - eks:UntagResource
                Resource: "*"
              # ec2:Get* was here and is not needed: the agent makes no EC2
              # Get* calls at all (the only matches in the code are boto3's
              # client-side get_paginator). It did reach GetConsoleOutput and
              # GetPasswordData on any instance in the region, neither of which
              # this system has a use for.
              #
              # GetManagedPrefixListEntries is the single exception, and is not
              # the agent's: the add-cluster pipeline's
              # data "aws_ec2_managed_prefix_list" needs it to resolve a list
              # by name.
              - Sid: AllowEC2Read
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:GetManagedPrefixListEntries
                Resource: "*"
              # Read-only, and used before creating a node group: EC2 caps
              # running vCPUs per instance-family bucket, and exceeding it does
              # not fail the create call. The node group is accepted, the Auto
              # Scaling Group silently launches nothing, and it only surfaces
              # ~30 minutes later as CREATE_FAILED -- which is terminal and
              # blocks the node group name until deleted. ListServiceQuotas as
              # well as Get, because which quota governs a family is resolved by
              # reading the quota list rather than hardcoding codes.
              - Sid: AllowServiceQuotasRead
                Effect: Allow
                Action:
                  - servicequotas:GetServiceQuota
                  - servicequotas:ListServiceQuotas
                Resource: "*"
              # The agent creates exactly one security group -- the Traefik NLB
              # frontend -- and tags it at creation. Requiring the tag on the
              # request means it cannot create an untagged group it would then
              # be unable to modify.
              - Sid: AllowEC2CreateSecurityGroup
                Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/EKSManager: 'Managed'
              # Tagging a security group is allowed only as part of creating
              # it. Without ec2:CreateAction this statement would hand back
              # what the conditions below are for: tag any group in the
              # account, then modify it.
              - Sid: AllowEC2TagSecurityGroupOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource: "arn:aws:ec2:*:*:security-group/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateSecurityGroup
              # Subnets are tagged after the fact (kubernetes.io/role/* for
              # load balancer discovery), and rule tags are written by the
              # add-cluster pipeline's provider. Neither is a resource type
              # anything here keys an access decision off.
              - Sid: AllowEC2TagExistingResources
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - "arn:aws:ec2:*:*:subnet/*"
                  - "arn:aws:ec2:*:*:security-group-rule/*"
              # Two statements, not one with two conditions -- conditions
              # within a statement are ANDed, and these are alternatives.
              #
              # The EKS cluster security group is created by EKS, not by us, so
              # it carries no EKSManager tag. It does carry aws:eks:cluster-name,
              # which is better: keys beginning with "aws:" are reserved, so no
              # principal can write one to adopt a group it does not own.
              - Sid: AllowIngressOnEKSClusterSecurityGroups
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                Resource: "*"
                Condition:
                  "Null":
                    aws:ResourceTag/aws:eks:cluster-name: "false"
              - Sid: AllowIngressOnManagedSecurityGroups
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/EKSManager: 'Managed'
              # PassRole is NOT in this list -- see AllowPassRoleToEKSManager
              # below. On Resource "*" it is a privilege-escalation primitive:
              # any role in the account trusting ec2 or pods.eks could be
              # handed to a node group or pod identity association this role
              # controls, and its credentials read from there.
              - Sid: AllowIAM
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:CreateServiceLinkedRole
                Resource: "*"
              # Every role passed is one the agent created with this prefix:
              # the control plane role, the node role, and the per-cluster pod
              # identity roles. Deliberately no iam:PassedToService condition
              # -- the correct service string differs between CreateNodegroup
              # and CreatePodIdentityAssociation, and getting it wrong fails at
              # cluster-create time for no extra safety over the prefix.
              - Sid: AllowPassRoleToEKSManagerRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: "arn:aws:iam::*:role/EKSManager-*"
              # ListHostedZones only -- the cluster's own DNS records are
              # written by external-dns under its own Pod Identity role, not
              # by this one.
              - Sid: AllowRoute53Read
                Effect: Allow
                Action:
                  - route53:ListHostedZones
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: "*"
              # Node group tags do not reach the instances EKS launches, so the
              # cost tag goes on the Auto Scaling Group with PropagateAtLaunch.
              - Sid: AllowAutoScaling
                Effect: Allow
                Action:
                  - autoscaling:CreateOrUpdateTags
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeTags
                Resource: "*"
              - Sid: AllowSSMReadOnly
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DescribeParameters
                Resource: !Sub "arn:aws:ssm:*:*:parameter/EKSManager/*"
              - Sid: AllowSTS
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - sts:TagSession
                  - sts:DecodeAuthorizationMessage
                Resource: "*"
              # The single most useful line in this policy. sts:AssumeRole on
              # "*" is what turns "can create a role under EKSManager-*" into
              # "can become account admin": create EKSManager-x with a trust
              # policy naming this role, give it *:*, assume it, and every Deny
              # below stops applying because the caller is a different
              # principal. Scoped here, that role cannot be assumed.
              #
              # One ARN is all the agent needs -- awsapi.py pins
              # CROSS_ACCOUNT_ROLE_NAME = "EKSManagerAdminRole" and every
              # assume path resolves through it. The account wildcard is the
              # cross-account hop and is bounded by the target's own trust.
              - Sid: AllowAssumeAdminRoleOnly
                Effect: Allow
                Action: sts:AssumeRole
                Resource: "arn:aws:iam::*:role/EKSManagerAdminRole"
              # Cuts the add-cluster pipeline down to the eight EC2 actions it
              # actually uses, without a second role in this template. The
              # pipeline assumes this role, so its permissions come from this
              # policy -- a Deny on EKSManagerPrefixListsSharedRole itself
              # would not follow the session across the hop and would do
              # nothing.
              #
              # aws:userid on an assumed session is "<RoleId>:<session-name>",
              # and the trust policy above pins that name for this principal
              # and forbids it for the agent. So this matches the pipeline's
              # sessions and only those.
              #
              # NotAction, so anything not listed is denied: iam:*, every eks:
              # write, sts:AssumeRole, Route53, ssm. The list is inverted, so
              # an action the provider needs and this omits shows up as a
              # broken build rather than a review finding -- deliberate, but
              # worth knowing before adding a resource type to
              # terraform/add-cluster.
              #
              # ModifySecurityGroupRules is here because the provider updates a
              # rule's description in place rather than replacing the rule.
              - Sid: DenyNonIngressWorkForPipelineSessions
                Effect: Deny
                NotAction:
                  - ec2:Describe*
                  - ec2:GetManagedPrefixListEntries
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:ModifySecurityGroupRules
                  - ec2:CreateTags
                  - sts:GetCallerIdentity
                Resource: "*"
                Condition:
                  StringLike:
                    aws:userid: "*:eksmanager-prefix-lists-add-cluster"
              - Sid: DenyEKSClusterDelete
                Effect: Deny
                Action: ["eks:DeleteCluster"]
                Resource: "*"
              # DenyIAMOutsideEKSManagerPrefix bounds WHICH roles can be
              # written; this bounds WHAT can be attached to them. Without it,
              # AttachRolePolicy on an EKSManager-* role can pull in
              # AdministratorAccess, and that role is then attached to compute
              # this same principal schedules onto.
              #
              # These six are every managed policy the agent attaches --
              # AmazonEKSClusterPolicy on the control plane role, the other
              # five on the node role (see awsapi.py create_eks_node_role).
              # Adding a seventh means adding it here, which is the point:
              # a new managed policy becomes a visible change rather than
              # something the existing grant already allowed.
              #
              # Inline policies are not covered -- iam:PutRolePolicy can still
              # write arbitrary permissions to an EKSManager-* role. Closing
              # that needs a permissions boundary, which is a separate change
              # requiring the agent to pass PermissionsBoundary on CreateRole.
              - Sid: DenyAttachingUnapprovedManagedPolicies
                Effect: Deny
                Action: iam:AttachRolePolicy
                Resource: "*"
                Condition:
                  ArnNotEquals:
                    iam:PolicyARN:
                      - "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
                      - "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
                      - "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
                      - "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
                      - "arn:aws:iam::aws:policy/AutoScalingFullAccess"
                      - "arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy"
              # What makes the EKSManager tag a boundary rather than a label. Without
              # this the conditions above cost an attacker one extra call:
              # tag someone else's node group, then delete it. The agent can
              # still set the tag at CREATION -- that path goes through
              # aws:RequestTag on CreateCluster/CreateNodegroup, not through
              # TagResource, so it is unaffected.
              #
              # UntagResource is included for the reverse: removing the tag
              # would orphan a resource out of every condition above, leaving
              # it unmanageable and invisible to the same policy that is
              # supposed to govern it.
              #
              # Adopting an untagged cluster or node group is therefore a
              # human action -- add EKSManager=Managed by hand and the agent
              # picks it up.
              - Sid: DenyEKSManagerTagWrites
                Effect: Deny
                Action:
                  - eks:TagResource
                  - eks:UntagResource
                Resource: "*"
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:TagKeys: EKSManager
              - Sid: DenyDestructiveEC2
                Effect: Deny
                Action:
                  - ec2:DeleteVpc
                  - ec2:DeleteSubnet
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteRouteTable
                  - ec2:DeleteNatGateway
                  - ec2:DeleteTransitGateway
                  - ec2:DeleteVpcPeeringConnection
                  - ec2:TerminateInstances
                  - ec2:DeleteSnapshot
                  - ec2:DeleteVolume
                Resource: "*"
              - Sid: DenyIAMOutsideEKSManagerPrefix
                Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                NotResource:
                  - "arn:aws:iam::*:role/EKSManager-*"
                  - "arn:aws:iam::*:instance-profile/EKSManager-*"
                  - "arn:aws:iam::*:role/aws-service-role/*"
              - Sid: DenyPersistentCredentials
                Effect: Deny
                Action:
                  - iam:CreateUser
                  - iam:CreateAccessKey
                  - iam:CreatePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:AttachUserPolicy
                  - iam:CreateLoginProfile
                  - iam:UpdateLoginProfile
                Resource: "*"
              - Sid: DenySecretsOutsideEKSManager
                Effect: Deny
                Action: ["secretsmanager:*"]
                NotResource: !Sub "arn:aws:secretsmanager:*:*:secret:/EKSManager/*"
              - Sid: DenyKMSDestructive
                Effect: Deny
                Action:
                  - kms:ScheduleKeyDeletion
                  - kms:DisableKey
                  - kms:DeleteAlias
                  - kms:DeleteImportedKeyMaterial
                Resource: "*"
              - Sid: DenyDestructiveECR
                Effect: Deny
                Action:
                  - ecr:DeleteRepository
                  - ecr:BatchDeleteImage
                  - ecr:DeleteLifecyclePolicy
                  - ecr:DeleteRegistryPolicy
                  - ecr:DeleteRepositoryPolicy
                Resource: "*"
              - Sid: DenyOutsideAllowedRegions
                Effect: Deny
                NotAction: !If
                  - AccountIsEnrolled
                  - ["iam:*", "sts:*", "route53:*"]
                  - ["ec2:DescribeRegions"]
                Resource: "*"
                Condition:
                  StringNotEquals:
                    aws:RequestedRegion: !Split
                      - ","
                      - !FindInMap
                        - AccountRegionMap
                        - !Ref "AWS::AccountId"
                        - "AllowedRegions"
                        - DefaultValue: "none"
      Tags:
        - Key: ManagedBy
          Value: EKSManager

Outputs:
  EKSManagerAdminRoleArn:
    Value: !GetAtt EKSManagerAdminRole.Arn
