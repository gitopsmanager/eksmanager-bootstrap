# -----------------------------------------------------------------------------
# EKS Manager Let's Encrypt — CodeBuild buildspec
# -----------------------------------------------------------------------------
# Sourced from S3 (lets-encrypt.zip). Two things start a build:
#   - the zip landing in the bucket  -> the code or zone list changed
#   - the weekly EventBridge rule    -> renew anything inside min_days_remaining
# Both run the same apply. Most weekly runs change nothing.
#
# Runs as EKSManagerLetsEncryptRole in shared services, which assumes each
# zone's roles.cert_manager to write its _acme-challenge TXT record.
# -----------------------------------------------------------------------------

version: 0.2

phases:
  install:
    commands:
      # Egress check first. This project is NOT VPC-attached -- it needs no
      # allowlisted NAT address, unlike the bootstrap and prefix-lists ones --
      # so this should always pass. It stays because the first symptom of a
      # network problem would otherwise be an unresolvable host on the Terraform
      # download, which reads like a mirror problem rather than a network one.
      - |
        EGRESS_IP=$(curl -sS --connect-timeout 10 --max-time 20 https://checkip.amazonaws.com 2>/dev/null | tr -d ' \t\r\n')
        case "${EGRESS_IP}" in
          ""|*[!0-9.]*)
            echo "=============================================================="
            echo "ERROR: no internet egress from this CodeBuild container."
            echo "  Needed for: the Terraform download, and Let's Encrypt itself."
            echo "  This project uses AWS-managed networking, so egress failing"
            echo "  here is unexpected -- check for an SCP or VPC endpoint policy."
            echo "=============================================================="
            exit 1
            ;;
          *) echo "OK: internet egress confirmed, public IP ${EGRESS_IP}" ;;
        esac
      - TERRAFORM_VERSION="1.11.0"
      - wget -q -O terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - unzip -q terraform.zip -d /tmp/terraform-install && mv /tmp/terraform-install/terraform /usr/local/bin/ && rm terraform.zip
      - terraform version

  pre_build:
    commands:
      - aws sts get-caller-identity
      - "echo 'OK: AWS identity confirmed'"

      # ── Resolve each zone's PUBLIC hosted zone id ──────────────────────────
      # Done here rather than with a Terraform data source for two reasons.
      # The zone lives in the customer's account, so the lookup needs that
      # account's credentials, and Terraform cannot select a provider per
      # for_each instance. And the public and private zones share a name, so
      # the lookup must filter on Config.PrivateZone == false -- by name alone
      # it is ambiguous, and picking the private zone writes a TXT record
      # Let's Encrypt can never see, failing much later as a bare timeout.
      #
      # Anything that fails here fails the build. A zone silently dropped from
      # the tfvars would make Terraform destroy its certificate and secret.
      - |
        set -eu
        python3 - <<'PY'
        import json, subprocess, sys

        zones = json.load(open("hosted-zones.json"))["hosted-zones"]
        out, failures = {}, []

        for z in zones:
            public = z["public-hosted-zone"]
            account = z["account"]
            prefix = z.get("dns-zone-prefix", "")
            role = z.get("roles", {}).get("cert_manager")
            if not prefix:
                failures.append(f"{public}: no dns-zone-prefix -- it names the secret")
                continue
            if not role:
                failures.append(f"{public}: no roles.cert_manager in hosted-zones.json")
                continue

            try:
                creds = json.loads(subprocess.run([
                    "aws", "sts", "assume-role",
                    "--role-arn", role,
                    "--role-session-name", "eksmanager-letsencrypt-zonelookup",
                    "--output", "json",
                ], capture_output=True, text=True, check=True).stdout)["Credentials"]
            except subprocess.CalledProcessError as e:
                failures.append(
                    f"{public}: cannot assume {role}. It must trust "
                    f"EKSManagerLetsEncryptRole. aws said: {e.stderr.strip()}"
                )
                continue

            env = {
                "AWS_ACCESS_KEY_ID": creds["AccessKeyId"],
                "AWS_SECRET_ACCESS_KEY": creds["SecretAccessKey"],
                "AWS_SESSION_TOKEN": creds["SessionToken"],
                "PATH": "/usr/local/bin:/usr/bin:/bin",
            }

            listed = json.loads(subprocess.run(
                ["aws", "route53", "list-hosted-zones-by-name",
                 "--dns-name", public, "--output", "json"],
                capture_output=True, text=True, check=True, env=env,
            ).stdout)["HostedZones"]

            # Trailing dot, and PUBLIC only -- the private zone of the same name
            # is the trap this whole block exists to avoid.
            want = public.rstrip(".") + "."
            public_zones = [
                h for h in listed
                if h["Name"] == want and not h.get("Config", {}).get("PrivateZone", False)
            ]

            if len(public_zones) != 1:
                failures.append(
                    f"{public}: expected exactly 1 public hosted zone, found "
                    f"{len(public_zones)} (private zones ignored)"
                )
                continue

            # Keyed on the prefix, not the DNS name: it is what names the
            # secret, so a duplicate would silently make two zones fight over
            # one secret rather than erroring.
            out[prefix] = {
                "dns_zone_prefix": prefix,
                "public_hosted_zone": public,
                "public_zone_id": public_zones[0]["Id"].split("/")[-1],
                "account": account,
                "cert_manager_role": role,
            }
            print(f"OK: {prefix} ({public}) -> {out[prefix]['public_zone_id']}")

        if failures:
            print("\n==============================================================")
            print("ERROR: could not resolve every zone. Refusing to continue --")
            print("a missing zone here would destroy its certificate and secret.")
            for f in failures:
                print(f"  - {f}")
            print("==============================================================")
            sys.exit(1)

        json.dump({"hosted_zones": out}, open("zones.auto.tfvars.json", "w"), indent=2)
        print(f"\nOK: resolved {len(out)} zone(s)")
        PY
      # ── ACME settings travel with the zone list ───────────────────────────
      # Read here rather than passed as CodeBuild environment variables so that
      # changing the contact address, or moving to staging while rebuilding a
      # cluster, is a file edit and a workflow run -- not a Terraform apply
      # against the pipeline module.
      #
      # Emitted as a tfvars file rather than exported, because a CodeBuild
      # `commands:` entry is its own shell: an export here would not survive
      # into the terraform invocation below.
      - |
        set -eu
        python3 - <<'PY'
        import json, sys

        doc = json.load(open("hosted-zones.json"))

        email = doc.get("acme-email", "")
        if not email:
            print("==============================================================")
            print("ERROR: no 'acme-email' at the top of hosted-zones.json.")
            print("Let's Encrypt requires a registration contact, and it is where")
            print("expiry warnings go -- the one alert that still arrives if this")
            print("pipeline stops running. Add, alongside 'hosted-zones':")
            print('  "acme-email": "you@example.com",')
            print("==============================================================")
            sys.exit(1)

        staging = bool(doc.get("acme-staging", False))

        with open("acme.auto.tfvars.json", "w") as f:
            json.dump({"acme_email": email, "acme_use_staging": staging}, f, indent=2)

        print(f"OK: acme-email={email} acme-staging={staging}")
        if staging:
            print("NOTE: staging issues from an untrusted root -- browsers warn and")
            print("      gRPC clients fail outright. Correct for rebuild testing,")
            print("      wrong for anything anyone actually uses.")
        PY

      - |
        terraform init -input=false \
          -backend-config="bucket=${STATE_BUCKET}" \
          -backend-config="key=${STATE_KEY}" \
          -backend-config="region=${AWS_REGION}"
      - "echo 'OK: terraform init complete'"

      # ── Reconcile state with the ACME endpoint in use ─────────────────────
      # Flipping acme-staging changes which ACME server the provider talks to,
      # and the account key is only registered on the one it was created
      # against. Terraform refreshes before it plans, so the FIRST thing that
      # happens after a flip is acme_certificate's read authenticating to the
      # new server with a key it has never seen:
      #
      #   Error: acme: error: 400 :: POST :: .../acme/new-acct ::
      #   urn:ietf:params:acme:error:accountDoesNotExist
      #
      # The plan dies there, so nothing downstream -- lifecycle rules,
      # replace_triggered_by, anything expressed in the configuration -- ever
      # gets a chance to run. It has to be fixed before plan, which is why it
      # lives here rather than in main.tf.
      #
      # acme_registration recovers on its own (its read returns "gone" and
      # Terraform recreates it), but acme_certificate errors instead, so both
      # are dropped together: keeping a certificate issued by an account that
      # no longer applies would leave the plan referring to an identity the
      # server does not recognise.
      #
      # state rm, deliberately not destroy. Destroying would honour
      # revoke_certificate_on_destroy and try to revoke the old certificate
      # against the NEW server, which cannot work -- the certificate belongs to
      # the other one. The superseded certificate is simply left to expire.
      #
      # tls_private_key.acme_account is kept. One key can hold an account on
      # both servers, and ACME new-acct returns the existing account rather
      # than erroring, so switching back later is idempotent.
      - |
        set -eu
        python3 - <<'PY'
        import json, subprocess, sys

        def tf(*args):
            return subprocess.run(["terraform", *args],
                                  capture_output=True, text=True, check=True).stdout

        want_staging = bool(json.load(open("acme.auto.tfvars.json"))["acme_use_staging"])
        wanted = "staging" if want_staging else "production"

        raw = tf("state", "pull").strip()
        state = json.loads(raw) if raw else {}

        # The registration's id IS the account URL, so the endpoint currently
        # recorded in state can be read straight off it -- no extra bookkeeping
        # resource, and nothing to fall out of step with reality.
        recorded_url = None
        for r in state.get("resources", []):
            if r.get("type") == "acme_registration":
                for i in r.get("instances", []):
                    a = i.get("attributes") or {}
                    recorded_url = a.get("registration_url") or a.get("id")

        if not recorded_url:
            print(f"OK: no ACME registration in state -- first run on {wanted}.")
            sys.exit(0)

        # "acme-staging-v02" vs "acme-v02" -- distinct substrings, so this does
        # not need to know either full URL.
        have_staging = "acme-staging" in recorded_url
        if have_staging == want_staging:
            print(f"OK: state is already on the {wanted} endpoint.")
            sys.exit(0)

        have = "staging" if have_staging else "production"
        print(f"ACME endpoint changed: {have} -> {wanted}.")
        print(f"  state holds an account on {have}: {recorded_url}")

        stale = [a for a in tf("state", "list").splitlines()
                 if a.startswith(("acme_certificate.", "acme_registration."))]

        if not stale:
            print("  nothing to remove.")
            sys.exit(0)

        # Passed as argv entries rather than through a shell, so an address
        # like acme_certificate.wildcard["dev"] needs no quoting.
        for addr in stale:
            print(f"  removing {addr} from state (not destroying it)")
            tf("state", "rm", addr)

        print(f"OK: state reconciled -- these will be recreated against {wanted}.")
        print("NOTE: the superseded certificate is left to expire, not revoked.")
        PY

  build:
    commands:
      - terraform plan -input=false -out=tfplan
      - terraform apply -input=false tfplan
      - "echo 'OK: terraform apply complete'"

      # Printed every run, including the many that renew nothing. This is the
      # cheapest check that renewal is still working, and it does not depend on
      # the thing doing the renewing -- which is exactly the failure mode that
      # otherwise stays invisible until a certificate expires.
      - terraform output -json certificate_expiry

  post_build:
    commands:
      - echo "Let's Encrypt run complete."
